# Website and live demo on GitHub Pages (#54, #55): on every push to main the website (website/)
# goes to / and the app, built from the synthetic demo dataset only, to /demo/.
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PAGES_DOMAIN   custom domain, e.g. casquette.es (also set it in Settings → Pages). Without it the
#                  site is served from <owner>.github.io/<repo>/ and the paths are derived from that.
#   SITE_LEGAL_*   legal notice and privacy policy details – required, the build fails without them
#   SITE_CABIN_HOST  Cabin analytics script host – optional, no analytics without it
# Details: website/README.md → "In the deploy".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Paths
        id: paths
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$PAGES_DOMAIN" ]; then
            origin="https://${PAGES_DOMAIN}/"; base="/demo/"
          elif [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "${owner}.github.io" ]; then
            origin="https://${owner}.github.io/"; base="/demo/"
          else
            origin="https://${owner}.github.io/${repo}/"; base="/${repo}/demo/"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Website: $origin · demo: ${origin}demo/ (base path $base)"

      - name: Build the demo
        env:
          DATA_SOURCE: demo
          PUBLIC_LEGAL_URL: ${{ steps.paths.outputs.origin }}
        run: npx astro build --base "${{ steps.paths.outputs.base }}" --outDir dist-demo

      - name: Check that the demo contains only demo data
        run: npm run demo:check -- dist-demo --base "${{ steps.paths.outputs.base }}"

      - name: Build the website with the demo
        env:
          SITE_LEGAL_NAME: ${{ vars.SITE_LEGAL_NAME }}
          SITE_LEGAL_ADDRESS: ${{ vars.SITE_LEGAL_ADDRESS }}
          SITE_LEGAL_COUNTRY: ${{ vars.SITE_LEGAL_COUNTRY }}
          SITE_LEGAL_EMAIL: ${{ vars.SITE_LEGAL_EMAIL }}
          SITE_CABIN_HOST: ${{ vars.SITE_CABIN_HOST }}
        run: npm run site:build -- --demo dist-demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
